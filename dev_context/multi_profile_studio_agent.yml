project:
  base_path: ./
  filters:
    - filter_in: 
      - ".ai_helper/agent/chat/multi_profile_studio_agent/**"  
      - ".ai_helper/agent/chat/my_assistant_agent_util/index.js"
      - ".ai_helper/agent/chat/messages_builder.js"
      - ".ai_helper/agent/chat/logger.js"
      # - ".ai_helper/dev/doc/chat/*.md"
      - ".ai_helper/dev/doc/chat/reference/**" # doc 是指向了 https://github.com/jtong/agent_marketplace clone 到本地的文件夹的软链接
      - ".ai_helper/dev/doc/chat/for_ai/**"
      - ".ai_helper/dev/host_code/chat/hostUtils.js" # host_code 是指向了 https://github.com/jtong/my_assistant_vs_plugin clone到本地的文件夹软链接
      - ".ai_helper/dev/host_code/chat/chatThreadRepository.js"
      # - ".ai_helper/dev/my_assistant_agent_examples/chat/**"
    - ignore:
      - ".ai_helper/agent/chat/multi_profile_studio_agent/.git"  
      - ".ai_helper/agent/chat/multi_profile_studio_agent/prompt"  
      # - ".ai_helper/dev/host_code/chat/webview/lib"
      - .ai_helper/agent/chat/multi_profile_studio_agent/node_modules/@(.*)
      - ".ai_helper/agent/chat/multi_profile_studio_agent/node_modules/!(ai-agent-response)"
      # - ".ai_helper/agent/chat/multi_profile_studio_agent/node_modules/!(ai-agent-response|@jtong)"
      # - ".ai_helper/agent/chat/multi_profile_studio_agent/node_modules/!(@jtong/knowledge_query)"
      # - ".ai_helper/agent/chat/multi_profile_studio_agent/node_modules/@jtong/knowledge_query/test"
      # - ".ai_helper/agent/chat/multi_profile_studio_agent/node_modules/@jtong/knowledge_query/doc"
      - config.yml
      - "**/*.png"
      - "**/.DS_Store"
      - ".ai_helper/**/debug-agent.log"
      - ".ai_helper/**/.DS_Store"
      - ".ai_helper/**/LICENSE.txt"
      - "**/LICENSE.txt"
      - ".ai_helper/**/package-lock.json"
      - "**/package-lock.json"
      - "**/test"
      - "*.yml"
      - "**/*.log"
      - "*.log"
      - README.md
    # - ignore:
    #   - ".ai_helper/dev/doc/chat/*.md"
    #   # - ".ai_helper/dev/doc/chat/!(reference|usecase)/**"
input:
  git_clone_to_path: .ai_helper/prompt_builder/git_repo
